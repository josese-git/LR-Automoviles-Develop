name: Deploy to Firebase Hosting & Functions on Merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
      - 'index.html'
      - 'telegram-bot/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd functions && npm ci

      - name: Deploy to Firebase Hosting and Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "hosting,functions" --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
